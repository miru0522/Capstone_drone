server {
    listen 80;
    server_name localhost;

    # 프론트엔드 정적 파일 (React SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 도커 내부 내장 DNS (127.0.0.11)를 사용하여 런타임 시점에 도메인 리졸브
    resolver 127.0.0.11 valid=30s;

    # STOMP 웹소켓 (SockJS) - backend로 프록시
    location /ws {
        set $backend_upstream https://backend:8080;
        proxy_pass $backend_upstream;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # AI서버(영상분석) - ai_server:8000으로 프록시
    location /analyze-video {
        set $ai_upstream http://ai_server:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 200M;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    # 실시간 영상 MJPEG 중계 - 반드시 아래 일반 API 블록보다 먼저 온다
    #
    # proxy_buffering을 끄지 않으면 nginx가 프레임을 모았다가 뭉텅이로 내보내
    # 실시간이 아니게 된다. MJPEG는 끝나지 않는 응답이라 read_timeout도 길게 잡는다.
    location ~ ^/drones/[^/]+/stream$ {
        set $backend_stream_upstream https://backend:8080;
        proxy_pass $backend_stream_upstream;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 외 REST API 전부 - backend로 프록시
    location ~ ^/(auth|users|drones|patrol-routes|events|healthcheck|media|wavdata|profile|admin)/ {
        set $backend_api_upstream https://backend:8080;
        proxy_pass $backend_api_upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(auth|users|drones|patrol-routes|events|healthcheck|media|wavdata|profile|admin)$ {
        set $backend_api_upstream https://backend:8080;
        proxy_pass $backend_api_upstream;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
